name: Deploy to Google Cloud Platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: connect-ph-api

jobs:
  # ============================================
  # 1. LINT & TEST
  # ============================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ============================================
  # 2. DEPLOY CLOUD SQL (Infraestructura DB)
  # ============================================
  deploy-cloudsql:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init - Cloud SQL
        working-directory: infrastructure/cloudsql
        run: terraform init

      - name: Terraform Plan - Cloud SQL
        working-directory: infrastructure/cloudsql
        run: terraform plan -var="project_id=${{ secrets.GCP_PROJECT_ID }}" -var="db_password=${{ secrets.DB_PASSWORD }}" -var="vpc_id=${{ secrets.VPC_ID }}" -out=tfplan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Apply - Cloud SQL
        working-directory: infrastructure/cloudsql
        run: terraform apply -auto-approve tfplan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: Get Cloud SQL outputs
        working-directory: infrastructure/cloudsql
        run: |
          echo "DB_HOST=$(terraform output -raw private_ip)" >> $GITHUB_ENV
          echo "DB_CONNECTION_NAME=$(terraform output -raw connection_name)" >> $GITHUB_ENV
          echo "DB_NAME=$(terraform output -raw database_name)" >> $GITHUB_ENV
          echo "DB_USER=$(terraform output -raw username)" >> $GITHUB_ENV

  # ============================================
  # 3. DEPLOY LIVEKIT CLUSTER
  # ============================================
  deploy-livekit:
    runs-on: ubuntu-latest
    needs: [test, deploy-cloudsql]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init - LiveKit
        working-directory: infrastructure/livekit-cluster
        run: terraform init

      - name: Terraform Plan - LiveKit
        working-directory: infrastructure/livekit-cluster
        run: terraform plan -var="project_id=${{ secrets.GCP_PROJECT_ID }}" -var="vpc_id=${{ secrets.VPC_ID }}" -out=tfplan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Apply - LiveKit
        working-directory: infrastructure/livekit-cluster
        run: terraform apply -auto-approve tfplan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: Get LiveKit LB IP
        working-directory: infrastructure/livekit-cluster
        run: |
          echo "LIVEKIT_LB_IP=$(terraform output -raw livekit_lb_ip)" >> $GITHUB_ENV
          echo "LIVEKIT_REDIS_HOST=$(terraform output -raw redis_host)" >> $GITHUB_ENV

  # ============================================
  # 4. BUILD & DEPLOY API (Cloud Run)
  # ============================================
  deploy-api:
    runs-on: ubuntu-latest
    needs: [test, deploy-cloudsql, deploy-livekit]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v4
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          install_components: "beta"

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Deploy to Cloud Run
        id: deploy-api
        run: |
          # Deploy con todos los env vars necesarios
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production" \
            --set-env-vars "DB_HOST=${{ env.DB_HOST }}" \
            --set-env-vars "DB_USER=${{ env.DB_USER }}" \
            --set-env-vars "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars "DB_DATABASE=${{ env.DB_NAME }}" \
            --set-env-vars "DB_PORT=5432" \
            --set-env-vars "DB_SSL=require" \
            --set-env-vars "DB_POOL_MAX=100" \
            --set-env-vars "DB_POOL_MIN=10" \
            --set-env-vars "DB_POOL_ACQUIRE_TIMEOUT=30000" \
            --set-env-vars "DB_POOL_IDLE_TIMEOUT=30000" \
            --set-env-vars "LIVEKIT_URL=wss://${{ env.LIVEKIT_LB_IP }}:7880" \
            --set-env-vars "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" \
            --set-env-vars "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}" \
            --set-env-vars "LIVEKIT_REDIS_HOST=${{ env.LIVEKIT_REDIS_HOST }}" \
            --set-env-vars "LIVEKIT_REDIS_PORT=6379" \
            --set-env-vars "LIVEKIT_TTL=8h" \
            --set-env-vars "LIVEKIT_ROOM_STRATEGY=selective_forwarding" \
            --set-env-vars "LIVEKIT_MAX_PARTICIPANTS_PER_ROOM=2000" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "JWT_EXPIRE=1h" \
            --set-env-vars "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" \
            --set-env-vars "API_VERSION=api/v1" \
            --set-env-vars "PORT=3001" \
            --format json \
          | jq -r '.status.url' > api_url.txt

          # Extraer URL del output
          API_URL=$(cat api_url.txt)
          echo "API_URL=$API_URL" >> $GITHUB_ENV

      - name: Health check API
        run: |
          echo "Waiting for Cloud Run service to be ready..."
          sleep 30
          curl -f "${{ env.API_URL }}/health" || exit 1
        env:
          NO_ERROR: true

      - name: Get Cloud Run URL
        run: |
          echo "API_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.url)')" >> $GITHUB_ENV

      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          sleep 30
          curl -f ${{ env.API_URL }}/health || exit 1
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

  # ============================================
  # 5. NOTIFICACIÓN DE ÉXITO/ERROR
  # ============================================
  notify:
    runs-on: ubuntu-latest
    needs: [test, deploy-cloudsql, deploy-livekit, deploy-api]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy-api.result == 'success'
        run: |
          echo "✅ Deploy completed successfully!"
          echo ""
          echo "📊 Deployment Summary:"
          echo "  - API URL: ${{ env.API_URL }}"
          echo "  - DB Host: ${{ env.DB_HOST }}"
          echo "  - LiveKit LB: ${{ env.LIVEKIT_LB_IP }}"
          echo "  - Region: ${{ env.REGION }}"
          echo ""
          echo "🔗 Endpoints:"
          echo "  - API: ${{ env.API_URL }}/api/v1"
          echo "  - Health: ${{ env.API_URL }}/health"
          echo "  - Swagger: ${{ env.API_URL }}/api/docs"
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify failure
        if: needs.deploy-api.result != 'success'
        run: |
          echo "❌ Deploy failed!"
          echo "Check workflow logs for details."
          exit 1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
